spring.application.name=dataflow-realtime-processor
server.port=8080

# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable simulation and RabbitMQ listener during test context boot
dataflow.simulation.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

# Disable OTel network export during tests
tanzu.metrics.jvm.enabled=false
tanzu.metrics.custom.enabled=false
